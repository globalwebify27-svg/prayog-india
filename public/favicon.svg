<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#01254d" />
  
  <defs>
    <!-- Radial glow in center -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0" />
    </radialGradient>
    
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="40%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>
  
  <!-- Subtle golden radial glow behind the emblem -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)" />
  
  <!-- Outer gear/innovation ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-dasharray="48 24" />
  
  <!-- "PI" Monogram -->
  <g transform="translate(156, 146)">
    <!-- Letter 'P' -->
    <!-- Vertical stem of the P -->
    <rect x="0" y="0" width="28" height="220" rx="14" fill="url(#goldGrad)" />
    
    <!-- Loop of the P (ending at y=120 to clearly distinguish it from 'D') -->
    <path d="M 14,0 C 80,0 110,20 110,60 C 110,100 80,120 14,120" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Decorative tech dot inside loop of 'P' -->
    <circle cx="55" cy="60" r="15" fill="url(#goldGrad)" />

    <!-- Letter 'I' -->
    <!-- Vertical stem of the I -->
    <rect x="160" y="56" width="28" height="164" rx="14" fill="url(#goldGrad)" />
    <!-- Circle/Dot representing the head of the 'I' -->
    <circle cx="174" cy="14" r="20" fill="url(#goldGrad)" />
  </g>
</svg>
